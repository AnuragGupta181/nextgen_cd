# Backend Blue-Green Rollout (Argo Rollouts)
# Replaces the standard Deployment with an Argo Rollout for zero-downtime blue-green deployments.
# Reference: https://github.com/argoproj/argocd-example-apps/tree/master/blue-green
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: backend
  namespace: nextgen
  labels:
    app: coding-platform-backend
spec:
  replicas: 3
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: coding-platform-backend
  strategy:
    blueGreen:
      # Active service carries production traffic (current stable version)
      activeService: backend-active
      # Preview service carries test traffic (new version, pre-promotion)
      previewService: backend-preview
      # Require manual promotion via: kubectl argo rollouts promote backend -n nextgen
      autoPromotionEnabled: false
      # Scale preview to 1 replica for testing before full promotion
      previewReplicaCount: 1
      # Keep old (blue) pods alive for 60s after promotion for instant rollback
      scaleDownDelaySeconds: 60
  template:
    metadata:
      labels:
        app: coding-platform-backend
    spec:
      containers:
        - name: backend
          image: anurag181/nextgen-backend:15
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
              protocol: TCP
              name: http
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

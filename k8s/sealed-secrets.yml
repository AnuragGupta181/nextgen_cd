# Sealed Secrets for the backend
# This file is SAFE to commit to Git — only the Sealed Secrets controller
# running inside the cluster can decrypt these values.
#
# ──────────────────────────────────────────────────────────────────
# HOW TO GENERATE THIS FILE
# ──────────────────────────────────────────────────────────────────
#
# 1. Create a regular K8s Secret from your .env file:
#
#    kubectl create secret generic backend-secrets \
#      --namespace=nextgen \
#      --from-env-file=../../Coding-Plateform/Backend/.env \
#      --dry-run=client -o yaml > /tmp/raw-secret.yml
#
# 2. Seal it with kubeseal:
#
#    kubeseal \
#      --controller-name=sealed-secrets-controller \
#      --controller-namespace=kube-system \
#      --format yaml \
#      < /tmp/raw-secret.yml \
#      > k8s/sealed-secrets.yml
#
# 3. Commit and push sealed-secrets.yml — ArgoCD will apply it,
#    and the controller will decrypt it into a regular Secret.
#
# 4. Delete the raw file:  rm /tmp/raw-secret.yml
#
# ──────────────────────────────────────────────────────────────────

apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: backend-secrets
  namespace: nextgen
  labels:
    app: coding-platform-backend
spec:
  encryptedData:
    # ⚠️  PLACEHOLDER — Replace with actual kubeseal output
    # Each value below must be replaced with the kubeseal-encrypted string.
    # Run the kubeseal command above to generate real encrypted values.
    MONGODB_URI: "REPLACE_WITH_KUBESEAL_ENCRYPTED_VALUE"
    JWT_SECRET: "REPLACE_WITH_KUBESEAL_ENCRYPTED_VALUE"
    EMAIL_USER: "REPLACE_WITH_KUBESEAL_ENCRYPTED_VALUE"
    EMAIL_PASS: "REPLACE_WITH_KUBESEAL_ENCRYPTED_VALUE"
    REDIS_URL: "REPLACE_WITH_KUBESEAL_ENCRYPTED_VALUE"
    GROQ_API_KEY: "REPLACE_WITH_KUBESEAL_ENCRYPTED_VALUE"
    TURNSTILE_SECRET_KEY: "REPLACE_WITH_KUBESEAL_ENCRYPTED_VALUE"
  template:
    metadata:
      name: backend-secrets
      namespace: nextgen
      labels:
        app: coding-platform-backend
    type: Opaque


# Ingress routing — points to ACTIVE (production) services
# Argo Rollouts manages which ReplicaSet the active/preview services point to
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nextgen-ingress
  namespace: nextgen
  labels:
    app.kubernetes.io/part-of: coding-platform
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "backend-active"
spec:
  ingressClassName: nginx
  rules:
    - host: k8s.nextgen
      http:
        paths:
          # Backend API — all /api/* requests → active backend
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-active
                port:
                  number: 5000
          # WebSockets / Socket.IO — WebRTC signaling & real-time monitoring
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: backend-active
                port:
                  number: 5000
          # Frontend — everything else → active frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-active
                port:
                  number: 80
---
# Preview Ingress — for testing new versions before promotion
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nextgen-preview-ingress
  namespace: nextgen
  labels:
    app.kubernetes.io/part-of: coding-platform
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "backend-preview"
spec:
  ingressClassName: nginx
  rules:
    - host: preview.k8s.nextgen
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-preview
                port:
                  number: 5000
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: backend-preview
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-preview
                port:
                  number: 80

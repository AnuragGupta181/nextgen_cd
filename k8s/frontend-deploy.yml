# Frontend Blue-Green Rollout (Argo Rollouts)
# Reference: https://github.com/argoproj/argocd-example-apps/tree/master/blue-green
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: frontend
  namespace: nextgen
  labels:
    app: coding-platform-frontend
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: coding-platform-frontend
  strategy:
    blueGreen:
      # Active service carries production traffic
      activeService: frontend-active
      # Preview service for testing new version
      previewService: frontend-preview
      # Auto-promote frontend after readiness checks pass (frontend is static assets)
      autoPromotionEnabled: true
      # Keep old pods alive for 30s after promotion
      scaleDownDelaySeconds: 30
  template:
    metadata:
      labels:
        app: coding-platform-frontend
    spec:
      containers:
        - name: frontend
          image: anurag181/nextgen-frontend:16
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              protocol: TCP
              name: http
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
